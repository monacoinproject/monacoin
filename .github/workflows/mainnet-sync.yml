name: Mainnet sync

# Sync a real node from nothing with the latest code, on a runner that is thrown
# away afterwards, so nothing has to be kept anywhere.

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    # GitHub stops jobs at 360 minutes, so the sync test gives up before that.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: contrib/docker/Dockerfile
          load: true
          tags: monacoin:test
          cache-from: type=gha
      - name: Sync
        run: docker run --rm -e SYNC_TIMEOUT=19800 --entrypoint monacoin-sync-test monacoin:test
